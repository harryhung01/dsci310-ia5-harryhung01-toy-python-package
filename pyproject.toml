[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ia5-toy-python-package-harryhung01"
version = "0.1.0"
description = "Toy Python package for DSCI 310 IA5"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Harry Hung", email = "harry@example.com" }
]
dependencies = []

[project.urls]
Homepage = "https://github.com/harryhung01/ia5-toy-python-package"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
